name: build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Free ARM64 runner for public repos. This image must be native aarch64:
    # the DGX Spark is ARM64 and emulated builds of a CUDA/torch image are
    # both unusably slow and not what ships.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The runner has ~14 GB free and this image is ~8.4 GB with torch + CUDA.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ghcr.io/waxacabytes/minimax-music3-spark-ai-hub:1.1.0
            ghcr.io/waxacabytes/minimax-music3-spark-ai-hub:latest
          labels: |
            org.opencontainers.image.source=https://github.com/hitechcloud-vietnam/minimax-music3-nvidia-ai-hub
